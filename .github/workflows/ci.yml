name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:search

      - name: Install Cypress binary
        uses: cypress-io/github-action@v6
        with:
          install-command: pnpm install --frozen-lockfile
          runTests: false

      - name: Build
        env:
          VITE_USE_DEMO_DATA: "true"
        run: pnpm build

      - name: E2E tests
        env:
          CYPRESS_ADMIN_EMAIL: ${{ secrets.CYPRESS_ADMIN_EMAIL }}
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 &
          server_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [ "$server_ready" != "true" ]; then
            echo "Vite preview did not start on port 4173"
            exit 1
          fi
          if [ -z "$CYPRESS_ADMIN_EMAIL" ] || [ -z "$CYPRESS_ADMIN_PASSWORD" ]; then
            pnpm run cy:run --spec "cypress/e2e/navigation.cy.ts"
          else
            pnpm run cy:run
          fi
